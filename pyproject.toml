[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "podcast-generator-mcp"
version = "0.1.0"
description = "Podcast generator MCP server: an AI podcast generator for Claude, Cursor and Codex. Text to podcast with two cloned host voices, MP3, SRT transcript, chapters and RSS."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "RTY2345RR" }]
keywords = [
  "podcast-mcp", "podcast-generator-mcp", "ai-podcast-generator", "text-to-podcast", "podcast-generator", "mcp",
  "mcp-server", "model-context-protocol", "voice-cloning", "two-host-podcast", "notebooklm-alternative",
  "multi-speaker-tts", "podcast-rss", "srt", "chapters", "claude", "cursor", "codex", "elevenlabs-alternative", "miragea",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Intended Audience :: End Users/Desktop",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Multimedia :: Sound/Audio :: Speech",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "mcp>=1.9,<3",
  "httpx>=0.27",
  "imageio-ffmpeg>=0.5",
]

[project.optional-dependencies]
dev = ["pytest>=8", "anyio>=4", "build", "twine"]

[project.urls]
Homepage = "https://github.com/RTY2345RR/podcast-generator-mcp"
Demo = "https://huggingface.co/spaces/miragea/podcast-generator-mcp"
Repository = "https://github.com/RTY2345RR/podcast-generator-mcp"
Documentation = "https://github.com/RTY2345RR/podcast-generator-mcp#readme"
Issues = "https://github.com/RTY2345RR/podcast-generator-mcp/issues"
Changelog = "https://github.com/RTY2345RR/podcast-generator-mcp/blob/main/CHANGELOG.md"
"Voice engine" = "https://miragea.ai"

[project.scripts]
podcast-generator-mcp = "podcast_generator_mcp.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/podcast_generator_mcp"]

[tool.hatch.build.targets.sdist]
include = ["src/", "tests/", "examples/", "docs/", "README.md", "LICENSE", "CREDITS.md", "CHANGELOG.md", "llms.txt", "server.json", "glama.json", "Dockerfile", "pyproject.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
